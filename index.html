    // --- 3D Laptop Canvas ---
    const ThreeLaptopCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = canvas.offsetWidth);
        let height = (canvas.height = canvas.offsetHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = canvas.offsetWidth;
          height = canvas.height = canvas.offsetHeight;
        };
        window.addEventListener('resize', handleResize);

        let angle = 0;

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          angle += 0.015;

          const centerX = width / 2;
          const centerY = height / 2;

          // Glowing Background Mesh
          const grad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, Math.max(width, height) / 1.5);
          grad.addColorStop(0, 'rgba(99, 102, 241, 0.15)');
          grad.addColorStop(0.5, 'rgba(14, 165, 233, 0.08)');
          grad.addColorStop(1, 'rgba(8, 11, 17, 0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);

          // Render 3D Floating Devices / Laptops
          const devices = [
            { scale: 1.1, xOffset: 0, yOffset: Math.sin(angle) * 15, title: '3D High-Converting Web Engine' },
            { scale: 0.75, xOffset: -width * 0.28, yOffset: Math.cos(angle * 0.9) * 12 + 20, title: '3D Mobile App' },
            { scale: 0.75, xOffset: width * 0.28, yOffset: Math.sin(angle * 1.1) * 12 + 20, title: '3D AI Chatbot' },
          ];

          devices.forEach((dev) => {
            const dx = centerX + dev.xOffset;
            const dy = centerY + dev.yOffset;
            const w = 260 * dev.scale;
            const h = 160 * dev.scale;

            // Device Glass Screen
            ctx.save();
            ctx.translate(dx, dy);

            // Screen Outline
            ctx.shadowColor = 'rgba(99, 102, 241, 0.4)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2 * dev.scale;

            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, 12 * dev.scale);
            ctx.fill();
            ctx.stroke();

            // Screen Content Mockup
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-w / 2 + 10, -h / 2 + 10, w - 20, h - 30);

            // Glowing Lines
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-w / 2 + 20, -h / 2 + 25, w * 0.4, 8 * dev.scale);
            ctx.fillStyle = '#818cf8';
            ctx.fillRect(-w / 2 + 20, -h / 2 + 40, w * 0.6, 6 * dev.scale);

            // Device Base Keyboard
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.roundRect(-w / 2 - 20 * dev.scale, h / 2 - 5, w + 40 * dev.scale, 12 * dev.scale, 4);
            ctx.fill();

            ctx.restore();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="w-full h-full absolute inset-0 pointer-events-none" />;
    };
